apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: release-pipeline
spec:
  replicas: 3
  # Give up on a rollout that makes no progress for 30 s; deploy.sh then rolls back.
  # (Was 60 s; a healthy pod is ready in a few seconds, so 30 s still leaves room.)
  progressDeadlineSeconds: 30
  minReadySeconds: 5
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take an old pod down before a new one is ready, so a bad release
      # can't reduce capacity: its pods just never receive traffic.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          # deploy.sh sets the real tag; images are loaded straight into kind.
          image: release-pipeline:initial
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: mysql, key: database-url } }
            - name: REDIS_URL
              value: redis://redis:6379/0
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: release-pipeline
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8000 }]
